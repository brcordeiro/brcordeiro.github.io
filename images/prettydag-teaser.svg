<svg width="900" height="440" viewBox="0 0 900 440" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>prettyDAG — causal graph visualization</title>
  <desc>A styled causal DAG with nodes for treatment, outcome, mediator, covariate, and an unobserved confounder</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#FFFFFF"/>

  <!-- confounding edges from U (dashed) -->
  <line x1="428" y1="107" x2="316" y2="308" stroke="#D8DBE8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="468" y1="103" x2="697" y2="308" stroke="#D8DBE8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- causal edges -->
  <line x1="175" y1="245" x2="252" y2="314" stroke="#C8CCd8" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="312" y1="319" x2="465" y2="207" stroke="#C8CCd8" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M310,355 Q490,410 672,355" fill="none" stroke="#C8CCd8" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="522" y1="202" x2="672" y2="316" stroke="#C8CCd8" stroke-width="1" marker-end="url(#arr)"/>

  <!-- U — unobserved -->
  <circle cx="448" cy="78" r="32" fill="#FAFAFA" stroke="#C8CCDA" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="448" y="84" text-anchor="middle" fill="#6B7280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="500">U</text>
  <text x="448" y="124" text-anchor="middle" fill="#C8CCDA" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" letter-spacing="0.8">unobserved</text>

  <!-- X — covariate -->
  <circle cx="148" cy="218" r="32" fill="#FFFFFF" stroke="#C8CCDA" stroke-width="1.5"/>
  <text x="148" y="224" text-anchor="middle" fill="#374151" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="500">X</text>
  <text x="148" y="264" text-anchor="middle" fill="#C8CCDA" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" letter-spacing="0.8">covariate</text>

  <!-- T — treatment -->
  <circle cx="286" cy="348" r="32" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="286" y="354" text-anchor="middle" fill="#92400E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="500">T</text>
  <text x="286" y="394" text-anchor="middle" fill="#D97706" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" letter-spacing="0.8">treatment</text>

  <!-- M — mediator -->
  <circle cx="494" cy="180" r="32" fill="#FFFFFF" stroke="#C8CCDA" stroke-width="1.5"/>
  <text x="494" y="186" text-anchor="middle" fill="#374151" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="500">M</text>
  <text x="494" y="226" text-anchor="middle" fill="#C8CCDA" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" letter-spacing="0.8">mediator</text>

  <!-- Y — outcome -->
  <circle cx="712" cy="348" r="32" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="712" y="354" text-anchor="middle" fill="#065F46" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="500">Y</text>
  <text x="712" y="394" text-anchor="middle" fill="#059669" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" letter-spacing="0.8">outcome</text>

  <text x="872" y="428" text-anchor="end" fill="#E8EAF0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" letter-spacing="1.5">prettyDAG</text>
</svg>
