<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="480" fill="#f8f9fa" rx="12"/>

  <text x="390" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Loihi vs. Loihi 2: Key Improvements</text>

  <!-- Header row -->
  <rect x="30" y="52" width="340" height="36" rx="6" fill="#4a6fa5"/>
  <text x="200" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="white">Loihi (Gen 1)</text>
  <rect x="410" y="52" width="340" height="36" rx="6" fill="#1a3a8f"/>
  <text x="580" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="white">Loihi 2</text>

  <!-- vs badge -->
  <circle cx="390" cy="70" r="18" fill="#e8a020" stroke="white" stroke-width="2"/>
  <text x="390" y="75" text-anchor="middle" font-size="11" font-weight="800" fill="white">VS</text>

  <!-- Rows -->
  <!-- Process -->
  <rect x="30" y="98" width="720" height="44" rx="4" fill="#eef2f8"/>
  <text x="40" y="115" font-size="10" fill="#555" font-weight="600">PROCESS NODE</text>
  <text x="200" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Intel 14nm</text>
  <text x="580" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">Intel 4</text>
  <line x1="375" y1="102" x2="375" y2="138" stroke="#ccc" stroke-width="1"/>
  <line x1="405" y1="102" x2="405" y2="138" stroke="#ccc" stroke-width="1"/>

  <!-- Die Area -->
  <rect x="30" y="146" width="720" height="44" rx="4" fill="white"/>
  <text x="40" y="163" font-size="10" fill="#555" font-weight="600">DIE AREA</text>
  <text x="200" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#333">60 mm²</text>
  <text x="580" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">31 mm²  <tspan font-size="11" fill="#2a8a2a">↓ 48%</tspan></text>
  <line x1="375" y1="150" x2="375" y2="186" stroke="#eee" stroke-width="1"/>
  <line x1="405" y1="150" x2="405" y2="186" stroke="#eee" stroke-width="1"/>

  <!-- Neurons -->
  <rect x="30" y="194" width="720" height="44" rx="4" fill="#eef2f8"/>
  <text x="40" y="211" font-size="10" fill="#555" font-weight="600">MAX NEURONS / CHIP</text>
  <text x="200" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#333">128,000</text>
  <text x="580" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">1,000,000  <tspan font-size="11" fill="#2a8a2a">↑ 7.8×</tspan></text>
  <line x1="375" y1="198" x2="375" y2="234" stroke="#ccc" stroke-width="1"/>
  <line x1="405" y1="198" x2="405" y2="234" stroke="#ccc" stroke-width="1"/>

  <!-- Embedded Processors -->
  <rect x="30" y="242" width="720" height="44" rx="4" fill="white"/>
  <text x="40" y="259" font-size="10" fill="#555" font-weight="600">EMBEDDED PROCESSORS / CHIP</text>
  <text x="200" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#333">3</text>
  <text x="580" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">6  <tspan font-size="11" fill="#2a8a2a">↑ 2×</tspan></text>
  <line x1="375" y1="246" x2="375" y2="282" stroke="#eee" stroke-width="1"/>
  <line x1="405" y1="246" x2="405" y2="282" stroke="#eee" stroke-width="1"/>

  <!-- Spike generation speed -->
  <rect x="30" y="290" width="720" height="44" rx="4" fill="#eef2f8"/>
  <text x="40" y="307" font-size="10" fill="#555" font-weight="600">SPIKE GENERATION SPEED</text>
  <text x="200" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#333">baseline</text>
  <text x="580" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">10× faster</text>
  <line x1="375" y1="294" x2="375" y2="330" stroke="#ccc" stroke-width="1"/>
  <line x1="405" y1="294" x2="405" y2="330" stroke="#ccc" stroke-width="1"/>

  <!-- Information coding -->
  <rect x="30" y="338" width="720" height="44" rx="4" fill="white"/>
  <text x="40" y="355" font-size="10" fill="#555" font-weight="600">INFORMATION CODING</text>
  <text x="200" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Binary spike events</text>
  <text x="580" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">Graded (32-bit payload)</text>
  <line x1="375" y1="342" x2="375" y2="378" stroke="#eee" stroke-width="1"/>
  <line x1="405" y1="342" x2="405" y2="378" stroke="#eee" stroke-width="1"/>

  <!-- Neuron models -->
  <rect x="30" y="386" width="720" height="44" rx="4" fill="#eef2f8"/>
  <text x="40" y="403" font-size="10" fill="#555" font-weight="600">NEURON MODELS</text>
  <text x="200" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Generalized LIF</text>
  <text x="580" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a8f">Fully programmable</text>
  <line x1="375" y1="390" x2="375" y2="426" stroke="#ccc" stroke-width="1"/>
  <line x1="405" y1="390" x2="405" y2="426" stroke="#ccc" stroke-width="1"/>

  <!-- DNN inference footer -->
  <rect x="30" y="440" width="720" height="32" rx="6" fill="#0d1f4d"/>
  <text x="390" y="460" text-anchor="middle" font-size="11" fill="#8ab4f8">SDNN inference on Loihi 2 vs. rate-coded SNN on Loihi: &gt;10× speed and energy improvement</text>
</svg>
