<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="420" fill="#f8f9fa" rx="12"/>

  <text x="390" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Loihi 2 Chip Architecture</text>

  <!-- Chip boundary -->
  <rect x="210" y="55" width="360" height="310" rx="8" fill="#1a2744" stroke="#3a5fa5" stroke-width="2"/>
  <text x="390" y="76" text-anchor="middle" font-size="11" fill="#8ab4f8" font-weight="600">Loihi 2 Die</text>

  <!-- Neuromorphic Mesh (8×4 grid of cores) -->
  <rect x="228" y="85" width="282" height="205" rx="5" fill="#243560"/>
  <text x="369" y="101" text-anchor="middle" font-size="10" fill="#aac4f0">Neuromorphic Mesh (128 neuron cores)</text>

  <!-- Core grid 8×4 -->
  <g fill="#3a5fa5" stroke="#1a2744" stroke-width="0.5">
    <!-- Row 1 -->
    <rect x="236" y="107" width="28" height="20" rx="2"/><rect x="268" y="107" width="28" height="20" rx="2"/>
    <rect x="300" y="107" width="28" height="20" rx="2"/><rect x="332" y="107" width="28" height="20" rx="2"/>
    <rect x="364" y="107" width="28" height="20" rx="2"/><rect x="396" y="107" width="28" height="20" rx="2"/>
    <rect x="428" y="107" width="28" height="20" rx="2"/><rect x="460" y="107" width="28" height="20" rx="2"/>
    <!-- Row 2 -->
    <rect x="236" y="131" width="28" height="20" rx="2"/><rect x="268" y="131" width="28" height="20" rx="2"/>
    <rect x="300" y="131" width="28" height="20" rx="2"/><rect x="332" y="131" width="28" height="20" rx="2"/>
    <rect x="364" y="131" width="28" height="20" rx="2"/><rect x="396" y="131" width="28" height="20" rx="2"/>
    <rect x="428" y="131" width="28" height="20" rx="2"/><rect x="460" y="131" width="28" height="20" rx="2"/>
    <!-- Row 3 -->
    <rect x="236" y="155" width="28" height="20" rx="2"/><rect x="268" y="155" width="28" height="20" rx="2"/>
    <rect x="300" y="155" width="28" height="20" rx="2"/><rect x="332" y="155" width="28" height="20" rx="2"/>
    <rect x="364" y="155" width="28" height="20" rx="2"/><rect x="396" y="155" width="28" height="20" rx="2"/>
    <rect x="428" y="155" width="28" height="20" rx="2"/><rect x="460" y="155" width="28" height="20" rx="2"/>
    <!-- Row 4 (processors) -->
    <rect x="236" y="179" width="28" height="20" rx="2" fill="#5a82c8"/><rect x="268" y="179" width="28" height="20" rx="2" fill="#5a82c8"/>
    <rect x="300" y="179" width="28" height="20" rx="2" fill="#5a82c8"/><rect x="332" y="179" width="28" height="20" rx="2" fill="#5a82c8"/>
    <rect x="364" y="179" width="28" height="20" rx="2" fill="#5a82c8"/><rect x="396" y="179" width="28" height="20" rx="2" fill="#5a82c8"/>
    <rect x="428" y="179" width="28" height="20" rx="2"/><rect x="460" y="179" width="28" height="20" rx="2"/>
    <!-- Row 5 -->
    <rect x="236" y="203" width="28" height="20" rx="2"/><rect x="268" y="203" width="28" height="20" rx="2"/>
    <rect x="300" y="203" width="28" height="20" rx="2"/><rect x="332" y="203" width="28" height="20" rx="2"/>
    <rect x="364" y="203" width="28" height="20" rx="2"/><rect x="396" y="203" width="28" height="20" rx="2"/>
    <rect x="428" y="203" width="28" height="20" rx="2"/><rect x="460" y="203" width="28" height="20" rx="2"/>
    <!-- Row 6 -->
    <rect x="236" y="227" width="28" height="20" rx="2"/><rect x="268" y="227" width="28" height="20" rx="2"/>
    <rect x="300" y="227" width="28" height="20" rx="2"/><rect x="332" y="227" width="28" height="20" rx="2"/>
    <rect x="364" y="227" width="28" height="20" rx="2"/><rect x="396" y="227" width="28" height="20" rx="2"/>
    <rect x="428" y="227" width="28" height="20" rx="2"/><rect x="460" y="227" width="28" height="20" rx="2"/>
    <!-- Row 7 -->
    <rect x="236" y="251" width="28" height="20" rx="2"/><rect x="268" y="251" width="28" height="20" rx="2"/>
    <rect x="300" y="251" width="28" height="20" rx="2"/><rect x="332" y="251" width="28" height="20" rx="2"/>
    <rect x="364" y="251" width="28" height="20" rx="2"/><rect x="396" y="251" width="28" height="20" rx="2"/>
    <rect x="428" y="251" width="28" height="20" rx="2"/><rect x="460" y="251" width="28" height="20" rx="2"/>
    <!-- Row 8 -->
    <rect x="236" y="275" width="28" height="20" rx="2"/><rect x="268" y="275" width="28" height="20" rx="2"/>
    <rect x="300" y="275" width="28" height="20" rx="2"/><rect x="332" y="275" width="28" height="20" rx="2"/>
    <rect x="364" y="275" width="28" height="20" rx="2"/><rect x="396" y="275" width="28" height="20" rx="2"/>
    <rect x="428" y="275" width="28" height="20" rx="2"/><rect x="460" y="275" width="28" height="20" rx="2"/>
  </g>

  <!-- Legend for processor rows -->
  <rect x="296" y="182" width="8" height="8" rx="1" fill="#5a82c8"/>
  <text x="308" y="191" font-size="8" fill="#8ab4f8">μProcessor cores (×6)</text>

  <!-- I/O arrows top -->
  <line x1="390" y1="55" x2="390" y2="30" stroke="#00c8ff" stroke-width="2" marker-end="url(#ioarr)"/>
  <line x1="390" y1="55" x2="390" y2="30" stroke="#00c8ff" stroke-width="2" marker-start="url(#ioarr2)"/>
  <text x="390" y="22" text-anchor="middle" font-size="10" fill="#00c8ff">Parallel I/O (top)</text>

  <!-- I/O arrows bottom -->
  <line x1="390" y1="365" x2="390" y2="390" stroke="#00c8ff" stroke-width="2" marker-end="url(#ioarr)"/>
  <line x1="390" y1="365" x2="390" y2="390" stroke="#00c8ff" stroke-width="2" marker-start="url(#ioarr2)"/>
  <text x="390" y="408" text-anchor="middle" font-size="10" fill="#00c8ff">Parallel I/O (bottom)</text>

  <!-- I/O left -->
  <line x1="210" y1="210" x2="170" y2="210" stroke="#00c8ff" stroke-width="2" marker-end="url(#ioarr)"/>
  <line x1="210" y1="210" x2="170" y2="210" stroke="#00c8ff" stroke-width="2" marker-start="url(#ioarr2)"/>

  <!-- I/O right -->
  <line x1="570" y1="210" x2="610" y2="210" stroke="#00c8ff" stroke-width="2" marker-end="url(#ioarr)"/>
  <line x1="570" y1="210" x2="610" y2="210" stroke="#00c8ff" stroke-width="2" marker-start="url(#ioarr2)"/>

  <!-- Left annotation box: Neuron Core -->
  <rect x="10" y="90" width="185" height="110" rx="8" fill="#1e3a5f" stroke="#3a80c8" stroke-width="1.2"/>
  <text x="102" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#5ab8ff">Neuron Core</text>
  <text x="20" y="124" font-size="9.5" fill="#b0cce8">• Programmable neuron model</text>
  <text x="20" y="139" font-size="9.5" fill="#b0cce8">• Programmable learning rules</text>
  <text x="20" y="154" font-size="9.5" fill="#b0cce8">• Up to 128 KB synaptic memory</text>
  <text x="20" y="169" font-size="9.5" fill="#b0cce8">• Up to 8,192 neurons/core</text>
  <text x="20" y="184" font-size="9.5" fill="#b0cce8">• Fully asynchronous design</text>
  <!-- connector -->
  <line x1="195" y1="145" x2="228" y2="165" stroke="#3a80c8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Left annotation box 2: NoC Fabric -->
  <rect x="10" y="218" width="185" height="90" rx="8" fill="#1e3a5f" stroke="#3a80c8" stroke-width="1.2"/>
  <text x="102" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#5ab8ff">Low Overhead NoC</text>
  <text x="20" y="252" font-size="9.5" fill="#b0cce8">• 8×16-core 2D mesh</text>
  <text x="20" y="267" font-size="9.5" fill="#b0cce8">• Scalable to 1,000s of cores</text>
  <text x="20" y="282" font-size="9.5" fill="#b0cce8">• Dimension order routed</text>
  <text x="20" y="297" font-size="9.5" fill="#b0cce8">• Two physical fabrics</text>
  <line x1="195" y1="258" x2="228" y2="230" stroke="#3a80c8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Right annotation box 1: Parallel Off-Chip -->
  <rect x="585" y="90" width="185" height="100" rx="8" fill="#1e3a5f" stroke="#00c8ff" stroke-width="1.2"/>
  <text x="677" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#00d4ff">Parallel Off-Chip I/O</text>
  <text x="595" y="124" font-size="9.5" fill="#b0cce8">• 3D chip-to-chip scaling</text>
  <text x="595" y="139" font-size="9.5" fill="#b0cce8">• 6 scalability ports/chip</text>
  <text x="595" y="154" font-size="9.5" fill="#b0cce8">• 4× faster async signaling</text>
  <text x="595" y="169" font-size="9.5" fill="#b0cce8">• GPIO, Ethernet, SPI, AER</text>
  <line x1="585" y1="145" x2="570" y2="165" stroke="#00c8ff" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Right annotation box 2: μProcessors -->
  <rect x="585" y="210" width="185" height="90" rx="8" fill="#1e3a5f" stroke="#3a80c8" stroke-width="1.2"/>
  <text x="677" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#5ab8ff">Microprocessor Cores</text>
  <text x="595" y="244" font-size="9.5" fill="#b0cce8">• 6 embedded processors</text>
  <text x="595" y="259" font-size="9.5" fill="#b0cce8">• Spike-based communication</text>
  <text x="595" y="274" font-size="9.5" fill="#b0cce8">• Data encode / decode</text>
  <text x="595" y="289" font-size="9.5" fill="#b0cce8">• Network configuration</text>
  <line x1="585" y1="255" x2="570" y2="230" stroke="#3a80c8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bottom stat bar -->
  <rect x="210" y="335" width="360" height="30" rx="5" fill="#243560"/>
  <text x="390" y="354" text-anchor="middle" font-size="10" fill="#8ab4f8">Intel 4 process · 31 mm² die · 2.3B transistors · 1M neurons · &lt;200 ns timestep</text>

  <defs>
    <marker id="ioarr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00c8ff"/>
    </marker>
    <marker id="ioarr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00c8ff"/>
    </marker>
  </defs>
</svg>
