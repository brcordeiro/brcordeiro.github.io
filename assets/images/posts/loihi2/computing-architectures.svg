<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="320" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Today's Computing Architectures</text>

  <!-- --- Conventional Computing --- -->
  <rect x="30" y="58" width="245" height="230" rx="10" fill="#e8edf5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="152" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">Conventional Computing</text>

  <!-- CPU box -->
  <rect x="55" y="96" width="80" height="52" rx="6" fill="#4a6fa5" stroke="none"/>
  <text x="95" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="white">CPU</text>

  <!-- arrows -->
  <line x1="135" y1="122" x2="165" y2="122" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="165" y1="122" x2="135" y2="122" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Memory box -->
  <rect x="165" y="96" width="80" height="52" rx="6" fill="#6b8cba" stroke="none"/>
  <text x="205" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="white">Memory</text>

  <text x="152" y="172" text-anchor="middle" font-size="10.5" fill="#333">• Programming by Encoding Algorithms</text>
  <text x="152" y="189" text-anchor="middle" font-size="10.5" fill="#333">• Synchronous Clocking</text>
  <text x="152" y="206" text-anchor="middle" font-size="10.5" fill="#333">• Sequential Threads of Control</text>

  <!-- --- Parallel Computing --- -->
  <rect x="308" y="58" width="245" height="230" rx="10" fill="#eaf0e8" stroke="#3d7a3d" stroke-width="1.5"/>
  <text x="430" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4d1a">Parallel Computing</text>

  <!-- GPU grid -->
  <g transform="translate(323, 96)">
    <rect width="96" height="52" rx="4" fill="#3d7a3d"/>
    <g fill="rgba(255,255,255,0.55)">
      <rect x="6" y="8" width="12" height="8" rx="1"/><rect x="22" y="8" width="12" height="8" rx="1"/><rect x="38" y="8" width="12" height="8" rx="1"/><rect x="54" y="8" width="12" height="8" rx="1"/><rect x="70" y="8" width="12" height="8" rx="1"/>
      <rect x="6" y="22" width="12" height="8" rx="1"/><rect x="22" y="22" width="12" height="8" rx="1"/><rect x="38" y="22" width="12" height="8" rx="1"/><rect x="54" y="22" width="12" height="8" rx="1"/><rect x="70" y="22" width="12" height="8" rx="1"/>
      <rect x="6" y="36" width="12" height="8" rx="1"/><rect x="22" y="36" width="12" height="8" rx="1"/><rect x="38" y="36" width="12" height="8" rx="1"/><rect x="54" y="36" width="12" height="8" rx="1"/><rect x="70" y="36" width="12" height="8" rx="1"/>
    </g>
  </g>

  <line x1="419" y1="122" x2="449" y2="122" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="449" y1="122" x2="419" y2="122" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="449" y="96" width="80" height="52" rx="6" fill="#5a9a5a"/>
  <text x="489" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="white">Memory</text>

  <text x="430" y="172" text-anchor="middle" font-size="10.5" fill="#333">• Offline Training w/ Labeled Datasets</text>
  <text x="430" y="189" text-anchor="middle" font-size="10.5" fill="#333">• Synchronous Clocking</text>
  <text x="430" y="206" text-anchor="middle" font-size="10.5" fill="#333">• Parallel Dense Compute</text>

  <!-- --- Neuromorphic Computing --- -->
  <rect x="586" y="58" width="245" height="230" rx="10" fill="#f0eafc" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="708" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3a1a6b">Neuromorphic Computing</text>

  <!-- Neural network visual -->
  <g transform="translate(601,96)">
    <!-- nodes -->
    <circle cx="20" cy="26" r="9" fill="#6a3d9a" opacity="0.9"/>
    <circle cx="20" cy="52" r="9" fill="#6a3d9a" opacity="0.9"/>
    <circle cx="55" cy="14" r="9" fill="#8b5eb8" opacity="0.9"/>
    <circle cx="55" cy="38" r="9" fill="#8b5eb8" opacity="0.9"/>
    <circle cx="55" cy="62" r="9" fill="#8b5eb8" opacity="0.9"/>
    <circle cx="90" cy="26" r="9" fill="#a07dc8" opacity="0.9"/>
    <circle cx="90" cy="52" r="9" fill="#a07dc8" opacity="0.9"/>
    <!-- connections -->
    <line x1="29" y1="26" x2="46" y2="14" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="29" y1="26" x2="46" y2="38" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="29" y1="26" x2="46" y2="62" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="29" y1="52" x2="46" y2="14" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="29" y1="52" x2="46" y2="38" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="29" y1="52" x2="46" y2="62" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="14" x2="81" y2="26" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="38" x2="81" y2="26" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="62" x2="81" y2="26" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="14" x2="81" y2="52" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="38" x2="81" y2="52" stroke="#9b6ecf" stroke-width="1.2"/>
    <line x1="64" y1="62" x2="81" y2="52" stroke="#9b6ecf" stroke-width="1.2"/>
  </g>

  <text x="708" y="172" text-anchor="middle" font-size="10.5" fill="#333">• Learn On-the-Fly via Neuron Firing Rules</text>
  <text x="708" y="189" text-anchor="middle" font-size="10.5" fill="#333">• Asynchronous Event-Based Spikes</text>
  <text x="708" y="206" text-anchor="middle" font-size="10.5" fill="#333">• Parallel Sparse Compute</text>

  <!-- labels at bottom -->
  <text x="152" y="265" text-anchor="middle" font-size="11" fill="#4a6fa5">↑ familiar, proven</text>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#3d7a3d">↑ scales well</text>
  <text x="708" y="265" text-anchor="middle" font-size="11" fill="#6a3d9a">↑ μW power · ms latency</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
